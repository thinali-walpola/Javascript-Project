
<!DOCTYPE html>
<html>
<head>
    <title>User Registration</title>
</head>
<body>

    <h2>Registration</h2>

    <input type="text" id="username"
           placeholder="Enter your name">

    <button onclick="register()">
        Register
    </button>

    <h3 id="result"></h3>

    <script>
        function register() {

            let name = document
                .getElementById("username").value;

            document.getElementById("result").innerText =
                "Welcome " + name;
        }
    </script>

</body>
</html>
